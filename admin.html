<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Aduan | Desa Sepadu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .admin-wrap{max-width:1000px;margin:120px auto 50px;padding:20px}
        .admin-panel{background:#fff;border-radius:20px;padding:28px;box-shadow:0 15px 40px rgba(0,0,0,.08);margin-bottom:20px}
        .admin-row{border:1px solid #eee;border-radius:15px;padding:18px;margin:14px 0}
        .admin-row textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;min-height:100px;margin:10px 0;font-family:inherit}
        .admin-input{width:100%;box-sizing:border-box;padding:13px;margin:12px 0;border:1px solid #ddd;border-radius:10px}
        .admin-btn{padding:12px 20px;border:0;border-radius:10px;cursor:pointer;background:#7651d1;color:#fff;font-weight:600}
        .admin-hidden{display:none}
        .admin-badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#f1ecff;margin:6px 0}
        .admin-error{color:#c0392b}
        .admin-success{color:#16834b}
    </style>
</head>
<body>
<header class="navbar" id="navbar">
    <a href="index.html" class="brand">
        <span class="brand-icon">🏡</span>
        <span><strong>DESA SEPADU</strong><small>Dusun Seladu</small></span>
    </a>
    <nav class="nav-menu" id="navMenu">
        <a href="index.html">Home</a>
        <a href="profil.html">Profil</a>
        <a href="kehidupan.html">Kehidupan</a>
        <a href="budaya.html">Budaya</a>
        <a href="kontak.html">Kontak</a>
        <a href="admin.html" class="active">🔐 Admin</a>
    </nav>
    <button class="menu-toggle" id="menuToggle">☰</button>
</header>

<main class="admin-wrap">
    <div class="admin-panel" id="loginPanel">
        <span class="section-label">HALAMAN ADMIN</span>
        <h1>🔐 Admin Desa Sepadu</h1>
        <p>Masukkan password untuk mengelola aduan masyarakat.</p>
        <input class="admin-input" id="adminPassword" type="password" placeholder="Password admin">
        <button class="admin-btn" id="loginBtn">Masuk ke Admin</button>
        <p id="loginMsg" class="admin-error"></p>
    </div>

    <div class="admin-panel admin-hidden" id="dashboard">
        <span class="section-label">PENGELOLAAN ADUAN</span>
        <h1>📋 Daftar Aduan Masyarakat</h1>
        <p>Admin dapat melihat aduan dan memberikan jawaban.</p>
        <div id="list"></div>
    </div>
</main>

<script src="script.js"></script>
<script>
const PASSWORD='Sepadu2026!';
const loginPanel=document.getElementById('loginPanel');
const dashboard=document.getElementById('dashboard');
const list=document.getElementById('list');
document.getElementById('loginBtn').addEventListener('click',()=>{
    const pass=document.getElementById('adminPassword').value;
    if(pass===PASSWORD){
        loginPanel.classList.add('admin-hidden');
        dashboard.classList.remove('admin-hidden');
        renderAduan();
    }else{document.getElementById('loginMsg').textContent='Password salah.';}
});
document.getElementById('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});
function renderAduan(){
    const keys=Object.keys(localStorage).filter(k=>k.startsWith('aduan_'));
    if(!keys.length){list.innerHTML='<p>Belum ada aduan pada browser ini.</p>';return;}
    list.innerHTML='';
    keys.forEach(k=>{
        let x; try{x=JSON.parse(localStorage.getItem(k));}catch(e){return;}
        const row=document.createElement('div'); row.className='admin-row';
        row.innerHTML=`<strong>${escapeHtml(x.token||'')}</strong><br><span class="admin-badge">${escapeHtml(x.status||'Belum dijawab')}</span><p><b>${escapeHtml(x.nama||'')}</b></p><p><b>${escapeHtml(x.judul||'')}</b></p><p>${escapeHtml(x.aduan||'')}</p><textarea placeholder="Tulis jawaban admin">${escapeHtml(x.jawaban||'')}</textarea><br><button class="admin-btn">💬 Simpan Jawaban</button>`;
        row.querySelector('button').addEventListener('click',()=>{
            x.jawaban=row.querySelector('textarea').value;
            x.status=x.jawaban.trim()?'Sudah dijawab':'Belum dijawab';
            localStorage.setItem(k,JSON.stringify(x));
            renderAduan();
        });
        list.appendChild(row);
    });
}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script>
</body>
</html>
